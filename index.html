<style>
:root {
  --bg: #F7F4EE;
  --surface: #FFFFFF;
  --ink: #2A2523;
  --ink-soft: #6B625C;
  --line: #E7E1D8;
  --accent: #C2632B;
  --accent-soft: #F1E3D6;
  --scritto: #C2632B;
  --orale: #3E6B5C;
  --pratico: #3B5A8A;
  --altro: #9A948E;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(42,37,35,.06), 0 8px 24px rgba(42,37,35,.05);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overflow-x: hidden;
  width: 100%;
}

#app {
  max-width: 880px;
  width: 100%;
  margin: 0 auto;
  padding: 28px 20px 80px;
  overflow-x: hidden;
}

/* ---------- Header ---------- */

.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}

.topbar h1 {
  font-size: 22px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
  text-align: center;
  justify-self: center;
  cursor: default;
}

.classe-picker {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-self: start;
  min-width: 0;
  overflow: hidden;
}
.classe-picker select {
  width: auto;
  max-width: 220px;
  min-width: 0;
  padding: 8px 10px;
  font-weight: 600;
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}
.classe-picker .icon-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  width: 34px;
  height: 34px;
  font-size: 16px;
  cursor: pointer;
  color: var(--ink);
}
.classe-picker .icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

.admin-box {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  justify-self: end;
  min-width: 0;
  overflow: hidden;
  gap: 10px;
  font-size: 13px;
  color: var(--ink-soft);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 13px;
}

.pill.admin { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

.linklike {
  background: none;
  border: none;
  color: var(--ink-soft);
  text-decoration: underline;
  cursor: pointer;
  font-size: 13px;
  padding: 0;
}

/* ---------- Calendar ---------- */

.calendar-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.cal-nav h2 {
  font-size: 17px;
  font-weight: 600;
  margin: 0;
  text-transform: capitalize;
}

.cal-nav button {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  width: 34px;
  height: 34px;
  font-size: 16px;
  cursor: pointer;
  color: var(--ink);
}
.cal-nav button:hover { background: var(--accent-soft); border-color: var(--accent); }

.weekdays, .days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
}

.weekdays div {
  text-align: center;
  font-size: 12px;
  color: var(--ink-soft);
  padding-bottom: 6px;
  min-width: 0;
  overflow: hidden;
}

.day {
  position: relative;
  min-height: 68px;
  min-width: 0;
  border-radius: 10px;
  border: 1px solid transparent;
  padding: 6px 6px 8px;
  cursor: pointer;
  background: #FBFAF7;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: hidden;
}
.day:hover { border-color: var(--accent); }
.day.other-month { opacity: 0.35; cursor: default; }
.day.other-month:hover { border-color: transparent; }
.day.today { border-color: var(--ink-soft); }

.day .num { font-size: 13px; color: var(--ink-soft); }

.day-indicator {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 3px;
}
.day-indicator .day-num-badge {
  font-size: 11px;
  color: var(--ink-soft);
  font-weight: 600;
}
.dot.mix { background: var(--ink-soft); }

/* ---------- Legend ---------- */
.legend { display: flex; gap: 16px; margin-top: 16px; font-size: 13px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.scritto { background: var(--scritto); }
.dot.orale { background: var(--orale); }
.dot.pratico { background: var(--pratico); }
.dot.altro { background: var(--altro); }

/* ---------- Modal ---------- */

.overlay {
  position: fixed; inset: 0;
  background: rgba(42,37,35,.35);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  z-index: 50;
}

.modal {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 420px;
  padding: 24px;
  max-height: 88vh;
  overflow-y: auto;
}

.modal h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.modal .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 16px; }

label { display: block; font-size: 13px; color: var(--ink-soft); margin: 12px 0 5px; }
input[type=text], input[type=password], input[type=number], select, textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  background: #FDFCFA;
}
textarea { resize: vertical; min-height: 60px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.seg { display: flex; gap: 8px; margin-top: 4px; }
.seg button {
  flex: 1;
  border: 1px solid var(--line);
  background: #FDFCFA;
  border-radius: 10px;
  padding: 9px 6px;
  font-size: 13px;
  cursor: pointer;
  color: var(--ink);
}
.seg button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: #a33; }

.row { display: flex; gap: 10px; margin-top: 18px; }
.row .btn { flex: 1; }

.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tabs button {
  flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 13px; color: var(--ink-soft);
}
.tabs button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }

.detail-block {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.detail-block .tipo-badge {
  display: inline-block; font-size: 11px; color: #fff; border-radius: 6px; padding: 2px 8px; margin-bottom: 6px;
}
.detail-block h4 { margin: 0 0 2px; font-size: 15px; }
.detail-block p.desc { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-soft); }
.avg { font-size: 13px; margin-top: 10px; color: var(--ink-soft); }
.avg b { color: var(--ink); }

.voto-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 4px; }
.voto-grid button {
  border: 1px solid var(--line); background: #FDFCFA; border-radius: 8px; padding: 7px 0;
  font-size: 12.5px; cursor: pointer; color: var(--ink);
}
.voto-grid button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

.hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
.error { font-size: 13px; color: #a33; margin-top: 8px; }

.close-x {
  position: absolute; top: 16px; right: 16px;
  background: none; border: none; font-size: 18px; cursor: pointer; color: var(--ink-soft);
}
.modal { position: relative; }

.id-box {
  background: var(--accent-soft);
  border: 1px dashed var(--accent);
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  text-align: center;
  margin-top: 10px;
}
.id-box code { font-size: 16px; font-weight: 700; letter-spacing: .04em; }

.empty { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 20px 0; }

.icon-btn-inline {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 8px;
}
.icon-btn-inline:hover { background: var(--accent-soft); }

/* Probatio.AI: card chat inline sotto il calendario */
.ai-chat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-top: 16px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.ai-chat-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 16px;
  font-weight: 600;
  font-size: 14.5px;
  color: var(--ink);
  border-bottom: 1px solid var(--line);
}
.ai-chat-messages {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: #FAF7F2;
  max-height: 320px;
  overflow-y: auto;
}
.ai-msg {
  max-width: 84%;
  padding: 8px 11px;
  border-radius: 12px;
  font-size: 13.5px;
  line-height: 1.45;
  white-space: pre-line;
  word-wrap: break-word;
}
.ai-msg.assistente {
  align-self: flex-start;
  background: #fff;
  border: 1px solid var(--line, #e7e0d8);
  color: var(--ink);
  border-bottom-left-radius: 3px;
}
.ai-msg.utente {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 3px;
}
.ai-msg.loading { font-style: italic; opacity: .7; }
.ai-chat-input-row {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--line, #e7e0d8);
  background: #fff;
}
.ai-chat-input-row input {
  flex: 1;
  border: 1px solid var(--line, #e7e0d8);
  border-radius: 999px;
  padding: 9px 14px;
  font-size: 13.5px;
  outline: none;
  font-family: inherit;
}
.ai-chat-input-row input:focus { border-color: var(--accent); }
.ai-chat-input-row button {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  cursor: pointer;
  flex-shrink: 0;
}
.ai-chat-input-row button:disabled { opacity: .5; cursor: default; }

@media (max-width: 480px) {
  .day { min-height: 58px; }
  .modal { padding: 18px; }
}
</style>

<div id="app">
  <p style="text-align:center;color:#6B625C;padding:40px 0">Caricamento…</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@19.0.0"></script>
<script>
window.APPWRITE_CONFIG = {
  endpoint: "https://fra.cloud.appwrite.io/v1",
  projectId: "6a73405d0011a2eb0b12",
  databaseId: "6ab6e6df001aff1d0b3d",
  collections: {
    classi: "classi",
    verifiche: "verifiche",
    voti: "voti"
  },
  adminPassword: "143445"
};

// Configurazione micro-AI (riepilogo verifiche via Groq).
// ATTENZIONE: questo file gira su GitHub Pages (statico), quindi la chiave
// qui sotto è visibile a chiunque apra il sorgente della pagina.
// Usa una chiave dedicata a questo progetto con permessi/limiti minimi.
window.GROQ_CONFIG = {
  apiKey: "__GROQ_API_KEY__", // placeholder: sostituito dal workflow GitHub Actions al deploy
  model: "openai/gpt-oss-20b"
};
</script>
<script>
// ============================================================
// Probatio — logica app (con amministratore e modifica verifiche)
// ============================================================

const CFG = window.APPWRITE_CONFIG;
const { Client, Databases, ID, Query } = window.Appwrite;

const client = new Client().setEndpoint(CFG.endpoint).setProject(CFG.projectId);
const db = new Databases(client);
const COL = CFG.collections;

const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GIORNI = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const TIPI = { scritto: "Scritto", orale: "Orale", pratico: "Pratico", altro: "Altro" };
const VOTI_POSSIBILI = [];
for (let v = 4; v <= 10; v += 0.25) VOTI_POSSIBILI.push(Math.round(v * 100) / 100);

const LS_DEVICE = "verifiche_app_device_id";
const LS_CLASSE = "verifiche_app_ultima_classe";
const LS_ADMIN = "verifiche_app_admin";
const root = document.getElementById("app");

function deviceId() {
  let id = localStorage.getItem(LS_DEVICE);
  if (!id) { id = "d_" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(LS_DEVICE, id); }
  return id;
}

// hash breve e deterministico (cyrb53): serve per costruire ID documento Appwrite
// che restano sempre entro il limite di 36 caratteri, pur restando unici per
// la coppia verifica+dispositivo (stesso input => sempre lo stesso ID).
function cyrb53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function votoDocId(verificaId, devId) {
  return "v" + cyrb53(verificaId + "|" + devId).toString(36);
}

let state = {
  view: new Date(),
  classi: [],
  classeId: localStorage.getItem(LS_CLASSE) || null,
  verificheMese: [],
  isAdmin: localStorage.getItem(LS_ADMIN) === "1"
};

function fmtDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// ============================================================
// RENDER PRINCIPALE
// ============================================================

async function render() {
  root.innerHTML = `<p style="text-align:center;color:#6B625C;padding:40px 0">Caricamento…</p>`;

  if (state.classi.length === 0) {
    try {
      const res = await db.listDocuments(CFG.databaseId, COL.classi, [Query.limit(100), Query.orderAsc("nome")]);
      state.classi = res.documents;
    } catch (e) {
      root.innerHTML = `<p style="text-align:center;color:#a33;padding:40px 0">Impossibile contattare Appwrite. Controlla la configurazione.</p>`;
      return;
    }
  }

  if (!state.classeId || !state.classi.find(c => c.$id === state.classeId)) {
    state.classeId = state.classi[0]?.$id || null;
  }
  if (state.classeId) localStorage.setItem(LS_CLASSE, state.classeId);

  root.innerHTML = "";

  if (!state.classeId) {
    root.appendChild(renderNessunaClasse());
    return;
  }

  root.appendChild(renderTopbar());
  const calCard = el("div", "calendar-card");
  calCard.appendChild(renderCalNav());
  const weekdays = el("div", "weekdays");
  GIORNI.forEach(g => { const d = el("div", ""); d.textContent = g; weekdays.appendChild(d); });
  calCard.appendChild(weekdays);
  const daysGrid = el("div", "days");
  calCard.appendChild(daysGrid);
  const legend = el("div", "legend");
  legend.innerHTML = `
    <span><span class="dot scritto"></span>Scritto</span>
    <span><span class="dot orale"></span>Orale</span>
    <span><span class="dot pratico"></span>Pratico</span>
    <span><span class="dot altro"></span>Altro</span>
  `;
  calCard.appendChild(legend);
  root.appendChild(calCard);
  root.appendChild(renderChatAI());

  await caricaVerificheMese();
  disegnaGiorni(daysGrid);
}

async function caricaVerificheMese() {
  const y = state.view.getFullYear(), m = state.view.getMonth();
  const first = fmtDate(new Date(y, m, 1));
  const last = fmtDate(new Date(y, m + 1, 0));
  try {
    const res = await db.listDocuments(CFG.databaseId, COL.verifiche, [
      Query.equal("classeId", state.classeId),
      Query.greaterThanEqual("data", first),
      Query.lessThanEqual("data", last),
      Query.limit(200)
    ]);
    state.verificheMese = res.documents;
  } catch (e) {
    state.verificheMese = [];
  }
}

let chatAI = {
  messaggi: [
    { ruolo: "assistente", testo: "Ciao! Sono Probatio.AI. Chiedimi pure qualcosa sulle verifiche di questa classe, ad esempio: \"quando è la prossima verifica di arte?\"" }
  ],
  inviando: false
};

function renderChatAI() {
  const card = el("div", "ai-chat-card");
  card.innerHTML = `
    <div class="ai-chat-header">✨ Probatio.AI</div>
    <div class="ai-chat-messages" id="ai-chat-messages"></div>
    <form class="ai-chat-input-row" id="ai-chat-form">
      <input type="text" id="ai-chat-input" placeholder="Chiedi, es. quando è la prossima verifica di arte?" autocomplete="off" />
      <button type="submit" id="ai-chat-send" aria-label="Invia">➤</button>
    </form>
  `;

  const box = card.querySelector("#ai-chat-messages");
  chatAI.messaggi.forEach(m => {
    const msg = el("div", `ai-msg ${m.ruolo}`);
    msg.textContent = m.testo;
    box.appendChild(msg);
  });
  box.scrollTop = box.scrollHeight;

  card.querySelector("#ai-chat-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = card.querySelector("#ai-chat-input");
    const testo = input.value.trim();
    if (!testo) return;
    input.value = "";
    inviaMessaggioChatAI(testo);
  });

  return card;
}

function aggiungiMessaggioChatAI(ruolo, testo) {
  chatAI.messaggi.push({ ruolo, testo });
  const box = document.getElementById("ai-chat-messages");
  if (!box) return null;
  const msg = el("div", `ai-msg ${ruolo}`);
  msg.textContent = testo;
  box.appendChild(msg);
  box.scrollTop = box.scrollHeight;
  return msg;
}

async function inviaMessaggioChatAI(domanda) {
  if (chatAI.inviando) return;
  aggiungiMessaggioChatAI("utente", domanda);

  const chiave = window.GROQ_CONFIG?.apiKey || "";
  if (!chiave || chiave.startsWith("__GROQ")) {
    aggiungiMessaggioChatAI("assistente", "L'assistente non è ancora configurato: manca la chiave AI.");
    return;
  }

  chatAI.inviando = true;
  const sendBtn = document.getElementById("ai-chat-send");
  if (sendBtn) sendBtn.disabled = true;

  const bolla = aggiungiMessaggioChatAI("assistente", "Sto pensando...");
  bolla.classList.add("loading");

  try {
    const verifiche = await caricaTutteVerificheClasse();
    const risposta = await chiediGroqChat(domanda, verifiche);
    bolla.classList.remove("loading");
    bolla.textContent = risposta;
    chatAI.messaggi[chatAI.messaggi.length - 1].testo = risposta;
  } catch (e) {
    bolla.classList.remove("loading");
    bolla.textContent = "Non riesco a rispondere al momento, riprova tra poco.";
    chatAI.messaggi[chatAI.messaggi.length - 1].testo = bolla.textContent;
  } finally {
    chatAI.inviando = false;
    if (sendBtn) sendBtn.disabled = false;
  }
}

async function caricaTutteVerificheClasse() {
  try {
    const res = await db.listDocuments(CFG.databaseId, COL.verifiche, [
      Query.equal("classeId", state.classeId),
      Query.orderAsc("data"),
      Query.limit(300)
    ]);
    return res.documents;
  } catch (e) {
    return [];
  }
}

async function chiediGroqChat(domanda, verifiche) {
  const oggi = fmtDate(new Date());
  const elenco = verifiche.length
    ? verifiche.map(v =>
        `- ${v.data}: ${TIPI[v.tipo] || v.tipo} di ${v.materia}${v.descrizione ? " (" + v.descrizione + ")" : ""}`
      ).join("\n")
    : "(nessuna verifica registrata per questa classe)";

  // cronologia recente della conversazione (esclusa l'ultima bolla "Sto pensando..." e la domanda appena inviata)
  const cronologia = chatAI.messaggi
    .slice(0, -2)
    .slice(-8)
    .map(m => ({ role: m.ruolo === "utente" ? "user" : "assistant", content: m.testo }));

  const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${window.GROQ_CONFIG.apiKey}`
    },
    body: JSON.stringify({
      model: window.GROQ_CONFIG.model,
      messages: [
        {
          role: "system",
          content: `Sei Probatio.AI, l'assistente del calendario di verifiche scolastiche "Probatio". Rispondi in italiano in modo naturale, colloquiale e diretto, come in una chat (massimo 3-4 frasi). Oggi è ${oggi} (formato AAAA-MM-GG). Ecco l'elenco delle verifiche registrate per questa classe, con data in formato AAAA-MM-GG:\n${elenco}\nRispondi basandoti solo su queste informazioni. Se la risposta non si trova nell'elenco, dillo chiaramente invece di inventare. Non usare markdown, elenchi puntati o asterischi: solo testo semplice.`
        },
        ...cronologia,
        { role: "user", content: domanda }
      ],
      temperature: 0.4,
      // gpt-oss è un modello "ragionante": i token di ragionamento contano in max_tokens.
      // Con 250 finivano tutti nel ragionamento e la risposta usciva vuota.
      reasoning_effort: "low",
      include_reasoning: false,
      max_tokens: 2000
    })
  });

  if (!resp.ok) throw new Error("Errore API Groq: " + resp.status);
  const data = await resp.json();
  const testo = data?.choices?.[0]?.message?.content?.trim();
  if (!testo) throw new Error("Risposta Groq vuota");
  return testo;
}

function disegnaGiorni(grid) {
  grid.innerHTML = "";
  const y = state.view.getFullYear(), m = state.view.getMonth();
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // lunedì = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const oggi = fmtDate(new Date());

  const cells = [];
  for (let i = startOffset - 1; i >= 0; i--) cells.push({ day: daysInPrevMonth - i, other: true });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, other: false });
  while (cells.length % 7 !== 0) cells.push({ day: cells.length, other: true });

  cells.forEach(c => {
    const cell = el("div", "day" + (c.other ? " other-month" : ""));
    if (!c.other) {
      const dateStr = fmtDate(new Date(y, m, c.day));
      if (dateStr === oggi) cell.classList.add("today");
      const num = el("div", "num"); num.textContent = c.day;
      cell.appendChild(num);

      const verificheGiorno = state.verificheMese.filter(v => v.data === dateStr);
      if (verificheGiorno.length > 0) {
        const tipiUnici = [...new Set(verificheGiorno.map(v => v.tipo))];
        const dotClass = tipiUnici.length === 1 ? tipiUnici[0] : "mix";
        const indicatore = el("div", "day-indicator");
        indicatore.innerHTML = `<span class="dot ${dotClass}"></span><span class="day-num-badge">${verificheGiorno.length}</span>`;
        cell.appendChild(indicatore);
      }

      cell.addEventListener("click", () => {
        if (verificheGiorno.length > 0) apriModalDettaglio(dateStr, verificheGiorno);
        else if (state.isAdmin) apriModalNuovaVerifica(dateStr);
      });
    }
    grid.appendChild(cell);
  });
}

function apriModalNuovaVerifica(dateStr, verificaEsistente) {
  const { overlay, modal } = baseModal();
  const isEdit = !!verificaEsistente;
  let tipo = isEdit ? verificaEsistente.tipo : "scritto";

  modal.innerHTML = closeBtnHtml() + `
    <h3>${isEdit ? "Modifica verifica" : "Aggiungi verifica"}</h3>

      <button type="button" data-tipo="pratico" class="${tipo === "pratico" ? "active" : ""}">Pratico</button>
      <button type="button" data-tipo="altro" class="${tipo === "altro" ? "active" : ""}">Altro</button>

    <input type="text" id="materia" placeholder="es. Matematica" value="${isEdit ? escapeHtml(verificaEsistente.materia) : ""}" />
    <label>Descrizione (facoltativa)</label>
    <textarea id="descrizione" placeholder="Argomenti, capitoli, note...">${isEdit ? escapeHtml(verificaEsistente.descrizione || "") : ""}</textarea>
    <div class="error" id="nv-error" style="display:none"></div>
    <div class="row">
      <button class="btn secondary" id="annulla-btn">Annulla</button>
      <button class="btn" id="salva-btn">${isEdit ? "Salva modifiche" : "Salva"}</button>
    </div>
  `;
  bindClose(overlay, modal);
  modal.querySelectorAll("#tipo-seg button").forEach(b => {
    b.addEventListener("click", () => {
      tipo = b.dataset.tipo;
      modal.querySelectorAll("#tipo-seg button").forEach(x => x.classList.toggle("active", x.dataset.tipo === tipo));
    });
  });
  modal.querySelector("#annulla-btn").addEventListener("click", () => closeModal(overlay));
  modal.querySelector("#salva-btn").addEventListener("click", async () => {
    const materia = modal.querySelector("#materia").value.trim();
    const descrizione = modal.querySelector("#descrizione").value.trim();
    const err = modal.querySelector("#nv-error");
    if (!materia) { err.textContent = "Inserisci la materia."; err.style.display = ""; return; }
    try {
      if (isEdit) {
        await db.updateDocument(CFG.databaseId, COL.verifiche, verificaEsistente.$id, { tipo, materia, descrizione });
      } else {
        await db.createDocument(CFG.databaseId, COL.verifiche, ID.unique(), {
          classeId: state.classeId, data: dateStr, tipo, materia, descrizione
        });
      }
      closeModal(overlay);
      render();
    } catch (e) {
      err.textContent = "Errore nel salvataggio.";
      err.style.display = "";
    }
  });
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function dataLeggibile(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const giorni = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
  return cap(`${giorni[dt.getDay()]} ${d} ${MESI[m - 1]} ${y}`);
}

function feedbackDisponibile(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const soglia = new Date(y, m - 1, d, 13, 0, 0);
  return new Date() >= soglia;
}

async function apriModalDettaglio(dateStr, verifiche) {
  const { overlay, modal } = baseModal();
  modal.innerHTML = closeBtnHtml() + `
    <h3>${dataLeggibile(dateStr)}</h3>
    <div id="lista-verifiche"></div>
    ${state.isAdmin ? `<div class="row"><button class="btn" id="aggiungi-altra" style="width:100%">+ Aggiungi verifica</button></div>` : ""}
  `;
  bindClose(overlay, modal);
  const lista = modal.querySelector("#lista-verifiche");
  if (state.isAdmin) {
    modal.querySelector("#aggiungi-altra").addEventListener("click", () => {
      closeModal(overlay);
      apriModalNuovaVerifica(dateStr);
    });
  }

  for (const v of verifiche) {
    const block = el("div", "detail-block");
    block.innerHTML = `
      <span class="tipo-badge ${v.tipo}" style="background:var(--${v.tipo})">${TIPI[v.tipo]}</span>
      ${state.isAdmin ? `
        <button class="icon-btn-inline" style="float:right;margin-left:4px" data-del="${v.$id}" title="Elimina" aria-label="Elimina">🗑️</button>
        <button class="icon-btn-inline" style="float:right" data-edit="${v.$id}" title="Modifica" aria-label="Modifica">✏️</button>
      ` : ""}
      <h4>${escapeHtml(v.materia)}</h4>
      ${v.descrizione ? `<p class="desc">${escapeHtml(v.descrizione)}</p>` : ""}
      <div id="fb-${v.$id}"></div>
    `;
    lista.appendChild(block);

    if (state.isAdmin) {
      block.querySelector(`[data-del="${v.$id}"]`).addEventListener("click", async () => {
        if (!confirm("Eliminare questa verifica?")) return;
        try {
          await db.deleteDocument(CFG.databaseId, COL.verifiche, v.$id);
          closeModal(overlay);
          render();
        } catch {}
      });
      block.querySelector(`[data-edit="${v.$id}"]`).addEventListener("click", () => {
        closeModal(overlay);
        apriModalNuovaVerifica(dateStr, v);
      });
    }

    const fbBox = block.querySelector(`#fb-${v.$id}`);
    if (!feedbackDisponibile(dateStr)) {
      fbBox.innerHTML = `<p class="hint">Il feedback sarà disponibile dopo le 13:00 del giorno della verifica.</p>`;
      continue;
    }
    renderFeedbackBox(fbBox, v);
  }
}

async function renderFeedbackBox(box, verifica) {
  box.innerHTML = `<p class="hint">Caricamento...</p>`;
  let voti = [];
  try {
    const res = await db.listDocuments(CFG.databaseId, COL.voti, [
      Query.equal("verificaId", verifica.$id), Query.limit(500)
    ]);
    voti = res.documents;
  } catch {}

  const media = voti.length ? (voti.reduce((s, x) => s + x.voto, 0) / voti.length) : null;
  const mediaTxt = media !== null ? media.toFixed(2) : "—";

  const mioVotoId = votoDocId(verifica.$id, deviceId());
  const mioVoto = voti.find(v => v.$id === mioVotoId);

  box.innerHTML = `
    <p class="avg">Media della classe: <b>${mediaTxt}</b> (${voti.length} voto${voti.length === 1 ? "" : "i"})</p>
    ${mioVoto
      ? `<p class="hint">Hai già lasciato un feedback per questa verifica: <b>${mioVoto.voto}</b></p>`
      : `<label>Lascia il tuo voto</label><div class="voto-grid" id="voto-grid-${verifica.$id}"></div>`
    }
    <div class="error" id="fb-error-${verifica.$id}" style="display:none"></div>
  `;

  if (!mioVoto) {
    const grid = box.querySelector(`#voto-grid-${verifica.$id}`);
    VOTI_POSSIBILI.forEach(v => {
      const b = el("button", "");
      b.type = "button";
      b.textContent = v;
      b.addEventListener("click", async () => {
        grid.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
        try {
          await db.createDocument(CFG.databaseId, COL.voti, mioVotoId, {
            verificaId: verifica.$id, voto: v
          });
          renderFeedbackBox(box, verifica);
        } catch (e) {
          const err = box.querySelector(`#fb-error-${verifica.$id}`);
          err.textContent = "Hai già votato oppure si è verificato un errore.";
          err.style.display = "";
        }
      });
      grid.appendChild(b);
    });
  }
}

function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function baseModal() {
  const overlay = el("div", "overlay");
  const modal = el("div", "modal");
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  return { overlay, modal };
}
function closeBtnHtml() { return `<button class="close-x" id="close-modal">×</button>`; }
function bindClose(overlay, modal) {
  modal.querySelector("#close-modal").addEventListener("click", () => closeModal(overlay));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(overlay); });
}
function closeModal(overlay) { document.body.removeChild(overlay); }

// ============================================================
// AVVIO
// ============================================================
render();
</script>
</body>
</html>
